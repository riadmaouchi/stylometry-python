[build-system]
requires = ["setuptools>=68", "setuptools-scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stylometry-python"
dynamic = ["version"]
description = "Authorship attribution and stylometric analysis in Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Riad Maouchi" }
]
keywords = [
  "stylometry",
  "authorship attribution",
  "nlp",
  "text analysis",
  "forensics",
  "llm detection",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
]

[project.urls]
Homepage = "https://github.com/riadmaouchi/stylometry-python"
Repository = "https://github.com/riadmaouchi/stylometry-python"
Issues = "https://github.com/riadmaouchi/stylometry-python/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=5.0",
  "black>=24.8.0",
  "ruff>=0.6.0",
  "build>=1.2.0",
  "twine>=5.1.0",
]
docs = [
  "sphinx>=7.4.0",
  "sphinx-rtd-theme>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["stylometry*"]

[tool.setuptools_scm]
tag_regex = "^(?:v)?(?P<version>\\d+\\.\\d+\\.\\d+(?:a\\d+|b\\d+|rc\\d+)?)$"
fallback_version = "0.1.0"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.black]
target-version = ["py39"]
line-length = 88
